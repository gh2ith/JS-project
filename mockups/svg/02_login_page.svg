<svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
      .text-figma-title { font-weight: 700; fill: #1E293B; font-size: 18px; }
      .text-figma-meta { font-weight: 500; fill: #64748B; font-size: 12px; }
      .text-badge-num { font-weight: 700; fill: #FFFFFF; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .annotation-text { font-weight: 600; fill: #334155; font-size: 13px; }
      .annotation-line { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .measure-text { font-weight: 600; fill: #64748B; font-size: 11px; text-anchor: end; }
      .measure-line { stroke: #CBD5E1; stroke-width: 1; }
      .card-shadow { filter: drop-shadow(0 20px 30px rgba(15, 23, 42, 0.08)) drop-shadow(0 4px 6px rgba(15, 23, 42, 0.04)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.35)); }
    </style>

    <linearGradient id="login-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <clipPath id="login-left-clip">
      <rect width="440" height="640" rx="20" />
    </clipPath>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="1440" height="1000" fill="#F8FAFC" />

  <!-- ==================== FIGMA HEADER BAR ==================== -->
  <g id="Figma-Header" transform="translate(60, 24)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="8" height="8" rx="4" fill="#F24E1E" />
      <rect x="8" y="0" width="8" height="8" rx="4" fill="#FF7262" />
      <rect x="0" y="8" width="8" height="8" rx="4" fill="#A259FF" />
      <circle cx="12" cy="12" r="4" fill="#1ABCFE" />
      <rect x="0" y="16" width="8" height="8" rx="4" fill="#0ACF83" />
    </g>
    <text x="28" y="15" class="font-sans text-figma-title">Figma Wireframe • Login Page &amp; Role Routing</text>

    <g transform="translate(740, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta" text-anchor="middle">Main Grid (Centered Container)</text>
      <path d="M0 16V28M-4 24L0 28L4 24" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(940, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta" text-anchor="middle">Role-Based Redirection to Home</text>
      <path d="M-22 22H22M-22 18V26M22 18V26" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(1180, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta">HR-Only User Provisioning</text>
      <path d="M-10 7H-40" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== 12-COLUMN FIGMA LAYOUT GRID ==================== -->
  <g id="Figma-Grid-Columns" opacity="0.22">
    <rect x="180" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="270" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="360" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="450" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="540" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="630" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="720" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="810" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="900" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="990" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="1080" y="70" width="70" height="900" fill="#EFF6FF" />
    <rect x="1170" y="70" width="70" height="900" fill="#EFF6FF" />
  </g>

  <!-- Top Minimal Nav -->
  <g transform="translate(180, 80)">
    <g transform="translate(0, 0)">
      <rect width="32" height="32" rx="8" fill="#2563EB" />
      <path d="M8 16L13 21L22 11" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="22" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(940, 4)">
      <text x="0" y="16" class="font-sans" font-size="13" font-weight="600" fill="#64748B">← Back to Home</text>
    </g>
  </g>

  <!-- Section Marker 1: Split Login Container -->
  <g transform="translate(80, 180)">
    <circle cx="12" cy="12" r="12" fill="#0F172A" />
    <text x="12" y="12" class="font-sans text-badge-num">1</text>
    <text x="-12" y="16" class="font-sans measure-text">640px</text>
    <path d="M-6 0H-2V32H-6" class="measure-line" fill="none" />
  </g>

  <!-- ==================== SPLIT LOGIN CARD CONTAINER ==================== -->
  <g id="Login-Card-Wrapper" transform="translate(240, 150)">
    
    <!-- Outer White Surface Container -->
    <rect width="960" height="660" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" class="card-shadow" />

    <!-- Left Brand Showcase Panel -->
    <g clip-path="url(#login-left-clip)">
      <rect width="440" height="660" fill="url(#login-left-grad)" />
      
      <!-- Decorative Background Orbs -->
      <circle cx="80" cy="120" r="160" fill="#2563EB" opacity="0.3" filter="blur(40px)" />
      <circle cx="380" cy="500" r="180" fill="#60A5FA" opacity="0.2" filter="blur(50px)" />

      <!-- Left Panel Content (Properly Padded & Word-Wrapped) -->
      <g transform="translate(44, 50)">
        <!-- Badge -->
        <rect width="134" height="26" rx="13" fill="#1E293B" stroke="#334155" />
        <text x="67" y="17" class="font-sans" font-size="10" font-weight="700" fill="#93C5FD" text-anchor="middle">SECURE PORTAL</text>

        <!-- Headline (Split across 2 clean lines) -->
        <text x="0" y="65" class="font-sans" font-size="26" font-weight="800" fill="#FFFFFF">
          <tspan x="0" dy="0">Unified Workspace</tspan>
          <tspan x="0" dy="32">for Modern Teams</tspan>
        </text>

        <!-- Subtitle (Multi-line) -->
        <text x="0" y="145" class="font-sans" font-size="13" font-weight="400" fill="#CBD5E1">
          <tspan x="0" dy="0">Access your employee dashboard, review</tspan>
          <tspan x="0" dy="20">tasks, manage leave requests, and stay</tspan>
          <tspan x="0" dy="20">synchronized across all departments.</tspan>
        </text>

        <!-- Feature Points -->
        <g transform="translate(0, 225)">
          <!-- Item 1 -->
          <circle cx="12" cy="12" r="12" fill="#1E293B" stroke="#334155" />
          <path d="M8 12L11 15L16 9" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="12" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">Role-Adaptive Redirection</text>
          <text x="34" y="28" class="font-sans" font-size="11" font-weight="400" fill="#94A3B8">Automatic routing to Employee or HR view on Home.</text>

          <!-- Item 2 -->
          <g transform="translate(0, 52)">
            <circle cx="12" cy="12" r="12" fill="#1E293B" stroke="#334155" />
            <path d="M8 12L11 15L16 9" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="34" y="12" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">Zero Public Registration</text>
            <text x="34" y="28" class="font-sans" font-size="11" font-weight="400" fill="#94A3B8">Accounts are provisioned safely by HR administrators.</text>
          </g>

          <!-- Item 3 -->
          <g transform="translate(0, 104)">
            <circle cx="12" cy="12" r="12" fill="#1E293B" stroke="#334155" />
            <path d="M8 12L11 15L16 9" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="34" y="12" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF">LocalStorage Authentication</text>
            <text x="34" y="28" class="font-sans" font-size="11" font-weight="400" fill="#94A3B8">Instant session storage &amp; offline persistence.</text>
          </g>
        </g>

        <!-- Quote / Info Card -->
        <g transform="translate(0, 410)">
          <rect width="352" height="74" rx="14" fill="#0F172A" opacity="0.6" stroke="#334155" />
          <text x="16" y="28" class="font-sans" font-size="11" font-weight="600" fill="#93C5FD">“Simple, responsive, and elegant UI standard.”</text>
          <text x="16" y="50" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Bridgeway Engineering Standard • Junior Team 2026</text>
        </g>
      </g>
    </g>

    <!-- Right Side: Login Form -->
    <g transform="translate(480, 48)">
      <text x="0" y="28" class="font-sans" font-size="26" font-weight="800" fill="#0F172A">Sign in to your account</text>
      <text x="0" y="52" class="font-sans" font-size="13" font-weight="400" fill="#64748B">Enter your official company credentials provided by HR.</text>

      <!-- Role Demo Selector -->
      <g transform="translate(0, 74)">
        <rect width="420" height="42" rx="10" fill="#F1F5F9" stroke="#E2E8F0" />
        <!-- Employee Tab (Active) -->
        <rect x="4" y="4" width="204" height="34" rx="8" fill="#FFFFFF" class="card-shadow"/>
        <text x="106" y="22" class="font-sans" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle" dominant-baseline="central">• Employee Demo</text>

        <!-- HR Admin Tab -->
        <text x="314" y="22" class="font-sans" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle" dominant-baseline="central">HR Admin Demo</text>
      </g>

      <!-- Form Inputs Container -->
      <g transform="translate(0, 136)">
        
        <!-- Field 1: Email -->
        <text x="0" y="14" class="font-sans" font-size="11" font-weight="700" fill="#334155">COMPANY EMAIL ADDRESS</text>
        <rect y="22" width="420" height="46" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
        <text x="16" y="50" class="font-sans" font-size="13" font-weight="500" fill="#0F172A">sarah.jenkins@bridgeway.corp</text>
        <!-- Validation Check Icon -->
        <circle cx="394" cy="45" r="10" fill="#ECFDF5" />
        <path d="M390 45L393 48L398 42" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Field 2: Password with Crisp SVG Dot Circles -->
        <g transform="translate(0, 84)">
          <text x="0" y="14" class="font-sans" font-size="11" font-weight="700" fill="#334155">ACCOUNT PASSWORD</text>
          <rect y="22" width="420" height="46" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
          
          <!-- Authentic 8 Password Dots -->
          <g transform="translate(20, 45)">
            <circle cx="0" cy="0" r="3.5" fill="#0F172A" />
            <circle cx="14" cy="0" r="3.5" fill="#0F172A" />
            <circle cx="28" cy="0" r="3.5" fill="#0F172A" />
            <circle cx="42" cy="0" r="3.5" fill="#0F172A" />
            <circle cx="56" cy="0" r="3.5" fill="#0F172A" />
            <circle cx="70" cy="0" r="3.5" fill="#0F172A" />
            <circle cx="84" cy="0" r="3.5" fill="#0F172A" />
            <circle cx="98" cy="0" r="3.5" fill="#0F172A" />
          </g>

          <!-- Clean Eye Icon Path (Vector) -->
          <g transform="translate(382, 36)">
            <path d="M1 9C3.5 4.5 7.5 2 12 2C16.5 2 20.5 4.5 23 9C20.5 13.5 16.5 16 12 16C7.5 16 3.5 13.5 1 9Z" stroke="#64748B" stroke-width="1.6" fill="none" />
            <circle cx="12" cy="9" r="3" stroke="#64748B" stroke-width="1.6" fill="none" />
          </g>
        </g>

        <!-- Remember Me & Assistance -->
        <g transform="translate(0, 168)">
          <rect width="18" height="18" rx="4" fill="#2563EB" />
          <path d="M4 9L8 13L14 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="28" y="14" class="font-sans" font-size="12" font-weight="500" fill="#475569">Remember session in LocalStorage</text>
          <text x="420" y="14" class="font-sans" font-size="12" font-weight="600" fill="#2563EB" text-anchor="end">Need assistance?</text>
        </g>

        <!-- Submit Button -->
        <g transform="translate(0, 206)">
          <rect width="420" height="48" rx="12" fill="#2563EB" class="btn-shadow"/>
          <text x="210" y="25" class="font-sans" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Sign In to Dashboard →</text>
        </g>

        <!-- HR Notice (No Public Registration) -->
        <g transform="translate(0, 276)">
          <rect width="420" height="68" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
          <circle cx="28" cy="34" r="12" fill="#EFF6FF" />
          <text x="28" y="34" class="font-sans" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle" dominant-baseline="central">i</text>
          <text x="50" y="26" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">New Employee?</text>
          <text x="50" y="44" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Registration is managed by HR. Please contact your company HR</text>
          <text x="50" y="58" class="font-sans" font-size="11" font-weight="400" fill="#64748B">administrator to have your profile and credentials created.</text>
        </g>

        <!-- Redirect Destination Preview -->
        <g transform="translate(0, 360)">
          <text x="210" y="16" class="font-sans" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">
            Successful sign-in redirects to: <tspan font-weight="700" fill="#2563EB">Home Page (Personalized Services)</tspan>
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Annotation -->
  <g transform="translate(1220, 320)">
    <path d="M-10 0H30" class="annotation-line" />
    <text x="38" y="4" class="font-sans annotation-text">Role-Based Auth Flow</text>
    <text x="38" y="20" class="font-sans" font-size="11" fill="#64748B">Detects HR vs Employee</text>
    <text x="38" y="36" class="font-sans" font-size="11" fill="#64748B">Redirects to Home with custom services</text>
  </g>
</svg>
