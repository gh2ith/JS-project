<svg width="1440" height="1300" viewBox="0 0 1440 1300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
      .text-figma-title { font-weight: 700; fill: #1E293B; font-size: 18px; }
      .text-figma-meta { font-weight: 500; fill: #64748B; font-size: 12px; }
      .text-badge-num { font-weight: 700; fill: #FFFFFF; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .annotation-text { font-weight: 600; fill: #334155; font-size: 13px; }
      .annotation-line { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .measure-text { font-weight: 600; fill: #64748B; font-size: 11px; text-anchor: end; }
      .measure-line { stroke: #CBD5E1; stroke-width: 1; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.06)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.30)); }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="1300" fill="#F8FAFC" />

  <!-- Figma Header Bar -->
  <g id="Figma-Header" transform="translate(60, 24)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="8" height="8" rx="4" fill="#F24E1E" />
      <rect x="8" y="0" width="8" height="8" rx="4" fill="#FF7262" />
      <rect x="0" y="8" width="8" height="8" rx="4" fill="#A259FF" />
      <circle cx="12" cy="12" r="4" fill="#1ABCFE" />
      <rect x="0" y="16" width="8" height="8" rx="4" fill="#0ACF83" />
    </g>
    <text x="28" y="15" class="font-sans text-figma-title">Figma Wireframe • Employee Profile &amp; Edit Form</text>

    <g transform="translate(760, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta" text-anchor="middle">Personal Profile Details • JSON / LocalStorage</text>
      <path d="M0 16V28M-4 24L0 28L4 24" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(1040, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta">Self-Service Permissions</text>
      <path d="M-10 7H-40" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- 12-Column Grid -->
  <g id="Figma-Grid-Columns" opacity="0.20">
    <rect x="180" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="270" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="360" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="450" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="540" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="630" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="720" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="810" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="900" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="990" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="1080" y="70" width="70" height="1200" fill="#EFF6FF" />
    <rect x="1170" y="70" width="70" height="1200" fill="#EFF6FF" />
  </g>

  <!-- Section 1: Top Navigation Bar -->
  <g id="Navbar" transform="translate(180, 64)">
    <rect width="1080" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    <g transform="translate(24, 16)">
      <rect width="34" height="34" rx="8" fill="#2563EB" />
      <path d="M10 17L15 22L24 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="24" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(320, 25)">
      <text x="0" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">← Back to Home</text>
      <text x="140" y="14" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">My Profile</text>
      <text x="240" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Leave Requests</text>
      <text x="370" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">My Tasks</text>
    </g>
    <!-- Profile Mini -->
    <g transform="translate(930, 14)">
      <circle cx="18" cy="18" r="16" fill="#2563EB" />
      <text x="18" y="22" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SJ</text>
      <text x="42" y="23" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Sarah Jenkins</text>
    </g>
  </g>

  <!-- Section Marker 1: Profile Card Shell -->
  <g transform="translate(80, 180)">
    <circle cx="12" cy="12" r="12" fill="#0F172A" />
    <text x="12" y="12" class="font-sans text-badge-num">1</text>
    <text x="-12" y="16" class="font-sans measure-text">920px</text>
    <path d="M-6 0H-2V32H-6" class="measure-line" fill="none" />
  </g>

  <!-- Profile Header Banner -->
  <g id="Profile-Container" transform="translate(180, 160)">
    
    <!-- Top Identity Card -->
    <rect width="1080" height="200" rx="20" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow"/>
    
    <!-- Blue Ambient Header Strip -->
    <path d="M0 20C0 8.95431 8.95431 0 20 0H1060C1071.05 0 1080 8.95431 1080 20V70H0V20Z" fill="#EFF6FF" />
    <path d="M0 70H1080" stroke="#DBEAFE" stroke-width="1" />

    <!-- Avatar Floating Circle -->
    <g transform="translate(48, 30)">
      <circle cx="48" cy="48" r="48" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
      <circle cx="48" cy="48" r="42" fill="#2563EB" />
      <text x="48" y="56" class="font-sans" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">SJ</text>
    </g>

    <!-- Name & Badges -->
    <g transform="translate(160, 88)">
      <text x="0" y="24" class="font-sans" font-size="24" font-weight="800" fill="#0F172A">Sarah Jenkins</text>
      <text x="0" y="46" class="font-sans" font-size="14" font-weight="500" fill="#64748B">Frontend Engineer • Technology &amp; Innovation Department</text>
      
      <!-- Status Badge -->
      <g transform="translate(190, 8)">
        <rect width="84" height="22" rx="11" fill="#ECFDF5" stroke="#A7F3D0" />
        <circle cx="12" cy="11" r="3.5" fill="#059669" />
        <text x="22" y="15" class="font-sans" font-size="10" font-weight="700" fill="#059669">ACTIVE STAFF</text>
      </g>
    </g>

    <!-- Top Right Actions -->
    <g transform="translate(870, 100)">
      <rect width="160" height="42" rx="10" fill="#2563EB" class="btn-shadow"/>
      <text x="80" y="26" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">• Edit My Profile</text>
    </g>

    <!-- Lower Split: View Details Left + Edit Drawer Right -->
    <!-- Left Column: Personal Records (Read-Only) -->
    <g transform="translate(0, 230)">
      <rect width="520" height="520" rx="20" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      
      <g transform="translate(32, 32)">
        <rect width="150" height="24" rx="12" fill="#EFF6FF" />
        <text x="75" y="16" class="font-sans" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">EMPLOYEE DETAILS</text>
        <text x="0" y="55" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Employment Information</text>
        <text x="0" y="74" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Official company record loaded from employee JSON file.</text>

        <!-- Records Grid -->
        <g transform="translate(0, 95)">
          <!-- Row 1 -->
          <text x="0" y="16" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8">EMPLOYEE ID</text>
          <text x="0" y="34" class="font-sans" font-size="14" font-weight="600" fill="#0F172A">#EMP-2026-041</text>
          <line x1="0" y1="46" x2="456" y2="46" stroke="#F1F5F9" />

          <!-- Row 2 -->
          <text x="0" y="66" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8">OFFICIAL EMAIL</text>
          <text x="0" y="84" class="font-sans" font-size="14" font-weight="600" fill="#0F172A">sarah.jenkins@bridgeway.corp</text>
          <line x1="0" y1="96" x2="456" y2="96" stroke="#F1F5F9" />

          <!-- Row 3 -->
          <text x="0" y="116" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8">DEPARTMENT</text>
          <text x="0" y="134" class="font-sans" font-size="14" font-weight="600" fill="#0F172A">Software Engineering &amp; Design</text>
          <line x1="0" y1="146" x2="456" y2="146" stroke="#F1F5F9" />

          <!-- Row 4 -->
          <text x="0" y="166" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8">JOB POSITION</text>
          <text x="0" y="184" class="font-sans" font-size="14" font-weight="600" fill="#0F172A">Senior Frontend Web Engineer</text>
          <line x1="0" y1="196" x2="456" y2="196" stroke="#F1F5F9" />

          <!-- Row 5 -->
          <text x="0" y="216" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8">JOINING DATE</text>
          <text x="0" y="234" class="font-sans" font-size="14" font-weight="600" fill="#0F172A">January 15, 2024 (2 Years, 8 Months)</text>
          <line x1="0" y1="246" x2="456" y2="246" stroke="#F1F5F9" />

          <!-- Row 6 -->
          <text x="0" y="266" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8">DIRECT REPORT / HR LEAD</text>
          <text x="0" y="284" class="font-sans" font-size="14" font-weight="600" fill="#0F172A">Alex Vance (HR Director)</text>
        </g>
      </g>
    </g>

    <!-- Right Column: Edit Permitted Fields (LocalStorage Form) -->
    <g transform="translate(550, 230)">
      <rect width="530" height="520" rx="20" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      
      <g transform="translate(32, 32)">
        <rect width="130" height="24" rx="12" fill="#ECFDF5" />
        <text x="65" y="16" class="font-sans" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">EDITABLE FIELDS</text>
        <text x="0" y="55" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Update Personal Information</text>
        <text x="0" y="74" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Changes update your employee record in browser LocalStorage.</text>

        <!-- Form Inputs -->
        <g transform="translate(0, 95)">
          <!-- Input 1: Phone -->
          <text x="0" y="14" class="font-sans" font-size="11" font-weight="700" fill="#334155">PHONE NUMBER</text>
          <rect y="22" width="466" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
          <text x="14" y="48" class="font-sans" font-size="13" font-weight="500" fill="#0F172A">+962 7 9123 4567</text>

          <!-- Input 2: Avatar URL -->
          <g transform="translate(0, 76)">
            <text x="0" y="14" class="font-sans" font-size="11" font-weight="700" fill="#334155">PROFILE PICTURE URL / AVATAR</text>
            <rect y="22" width="466" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
            <text x="14" y="48" class="font-sans" font-size="12" font-weight="400" fill="#64748B">https://images.unsplash.com/photo-sarah-jenkins.jpg</text>
          </g>

          <!-- Input 3: Professional Bio / Skills -->
          <g transform="translate(0, 152)">
            <text x="0" y="14" class="font-sans" font-size="11" font-weight="700" fill="#334155">ABOUT / SHORT BIO</text>
            <rect y="22" width="466" height="74" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
            <text x="14" y="44" class="font-sans" font-size="12" font-weight="500" fill="#0F172A">Passionate frontend engineer specializing in responsive Bootstrap &amp;</text>
            <text x="14" y="62" class="font-sans" font-size="12" font-weight="500" fill="#0F172A">modern design systems with accessible UI/UX standards.</text>
          </g>

          <!-- Action Buttons -->
          <g transform="translate(0, 260)">
            <rect width="180" height="44" rx="10" fill="#2563EB" class="btn-shadow"/>
            <text x="90" y="27" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Save to LocalStorage</text>

            <rect x="196" width="100" height="44" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
            <text x="246" y="27" class="font-sans" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Reset</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Annotation -->
  <g transform="translate(1280, 340)">
    <path d="M-10 0H20" class="annotation-line" />
    <text x="28" y="4" class="font-sans annotation-text">Dual Split Profile</text>
    <text x="28" y="20" class="font-sans" font-size="11" fill="#64748B">Read-only company record</text>
    <text x="28" y="36" class="font-sans" font-size="11" fill="#64748B">Editable contact details</text>
  </g>
</svg>
