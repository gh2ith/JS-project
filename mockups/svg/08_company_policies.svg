<svg width="1440" height="1500" viewBox="0 0 1440 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
      .text-figma-title { font-weight: 700; fill: #1E293B; font-size: 18px; }
      .text-figma-meta { font-weight: 500; fill: #64748B; font-size: 12px; }
      .text-badge-num { font-weight: 700; fill: #FFFFFF; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .annotation-text { font-weight: 600; fill: #334155; font-size: 13px; }
      .annotation-line { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .measure-text { font-weight: 600; fill: #64748B; font-size: 11px; text-anchor: end; }
      .measure-line { stroke: #CBD5E1; stroke-width: 1; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.06)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.30)); }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="1500" fill="#F8FAFC" />

  <!-- Figma Header Bar -->
  <g id="Figma-Header" transform="translate(60, 24)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="8" height="8" rx="4" fill="#F24E1E" />
      <rect x="8" y="0" width="8" height="8" rx="4" fill="#FF7262" />
      <rect x="0" y="8" width="8" height="8" rx="4" fill="#A259FF" />
      <circle cx="12" cy="12" r="4" fill="#1ABCFE" />
      <rect x="0" y="16" width="8" height="8" rx="4" fill="#0ACF83" />
    </g>
    <text x="28" y="15" class="font-sans text-figma-title">Figma Wireframe • Company Policies Library (JSON-Driven)</text>

    <g transform="translate(780, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta" text-anchor="middle">Dynamic JSON Data Feed</text>
      <path d="M0 16V28M-4 24L0 28L4 24" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(1080, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta">Search &amp; Category Filters</text>
      <path d="M-10 7H-40" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- 12-Column Grid -->
  <g id="Figma-Grid-Columns" opacity="0.20">
    <rect x="180" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="270" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="360" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="450" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="540" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="630" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="720" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="810" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="900" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="990" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="1080" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="1170" y="70" width="70" height="1400" fill="#EFF6FF" />
  </g>

  <!-- Top Navigation Bar -->
  <g id="Navbar" transform="translate(180, 64)">
    <rect width="1080" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    <g transform="translate(24, 16)">
      <rect width="34" height="34" rx="8" fill="#2563EB" />
      <path d="M10 17L15 22L24 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="24" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(320, 25)">
      <text x="0" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">← Back to Home</text>
      <text x="140" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">My Profile</text>
      <text x="240" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Leave Requests</text>
      <text x="370" y="14" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">Company Policies</text>
    </g>
    <g transform="translate(930, 14)">
      <circle cx="18" cy="18" r="16" fill="#2563EB" />
      <text x="18" y="22" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SJ</text>
      <text x="42" y="23" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Sarah Jenkins</text>
    </g>
  </g>

  <!-- Page Header -->
  <g transform="translate(180, 160)">
    <rect width="140" height="26" rx="13" fill="#EEF2FF" />
    <text x="70" y="17" class="font-sans" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="middle">OFFICIAL POLICIES</text>
    <text x="0" y="60" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">Company Policies &amp; Guidelines</text>
    <text x="0" y="84" class="font-sans" font-size="14" font-weight="400" fill="#64748B">Loaded dynamically from policies.json. Browse standards, benefits, remote guidelines, and conduct protocols.</text>
  </g>

  <!-- Search & Category Filter Toolbar -->
  <g transform="translate(180, 270)">
    <rect width="1080" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    
    <!-- Search Input with Vector Magnifier -->
    <g transform="translate(20, 12)">
      <rect width="400" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.6" fill="none"/>
      <line x1="28" y1="24" x2="33" y2="29" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
      <text x="42" y="26" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Search policies by keyword...</text>
    </g>

    <!-- Filter Pills -->
    <g transform="translate(440, 15)">
      <rect width="60" height="36" rx="8" fill="#2563EB" />
      <text x="30" y="22" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">All (6)</text>

      <rect x="70" width="130" height="36" rx="8" fill="#F1F5F9" />
      <text x="135" y="22" class="font-sans" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Code of Conduct</text>

      <rect x="210" width="110" height="36" rx="8" fill="#F1F5F9" />
      <text x="265" y="22" class="font-sans" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Working Hours</text>

      <rect x="330" width="110" height="36" rx="8" fill="#F1F5F9" />
      <text x="385" y="22" class="font-sans" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Remote Work</text>

      <rect x="450" width="110" height="36" rx="8" fill="#F1F5F9" />
      <text x="505" y="22" class="font-sans" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Leave Policy</text>

      <rect x="570" width="60" height="36" rx="8" fill="#F1F5F9" />
      <text x="600" y="22" class="font-sans" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Ethics</text>
    </g>
  </g>

  <!-- Policies Accordion Stack -->
  <g id="Policies-List" transform="translate(180, 360)">
    
    <!-- Policy 1 (Expanded Accordion State) -->
    <g transform="translate(0, 0)">
      <rect width="1080" height="230" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" class="card-shadow" />
      
      <!-- Policy Header Row -->
      <g transform="translate(32, 28)">
        <rect width="124" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE" />
        <text x="62" y="16" class="font-sans" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">CODE OF CONDUCT</text>

        <text x="140" y="18" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Professional Workplace Ethics &amp; Integrity Policy</text>
        <text x="960" y="18" class="font-sans" font-size="13" font-weight="700" fill="#2563EB" text-anchor="end">▲ Collapse</text>
      </g>

      <!-- Expanded Content -->
      <g transform="translate(32, 75)">
        <line x1="0" y1="0" x2="1016" y2="0" stroke="#F1F5F9" />
        <text x="0" y="26" class="font-sans" font-size="13" font-weight="600" fill="#0F172A">Policy Overview • Version 2.4 • Effective Jan 2026</text>
        <text x="0" y="48" class="font-sans" font-size="12" font-weight="400" fill="#475569">All employees and contractors must maintain the highest standards of professional conduct, mutual respect, and accountability.</text>
        <text x="0" y="66" class="font-sans" font-size="12" font-weight="400" fill="#475569">Discrimination, harassment, and unauthorized disclosure of internal proprietary source code or data will result in immediate disciplinary review.</text>
        <text x="0" y="84" class="font-sans" font-size="12" font-weight="400" fill="#475569">Employees are encouraged to report any ethical concerns anonymously via the direct HR Feedback system located in the footer.</text>

        <rect y="105" width="160" height="30" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <g transform="translate(10, 112)">
          <path d="M2 2H10L14 6V16H2V2Z" stroke="#2563EB" stroke-width="1.4" fill="none"/>
          <line x1="5" y1="9" x2="11" y2="9" stroke="#2563EB" stroke-width="1.2"/>
          <line x1="5" y1="12" x2="11" y2="12" stroke="#2563EB" stroke-width="1.2"/>
          <text x="20" y="11" class="font-sans" font-size="11" font-weight="600" fill="#2563EB">Download PDF (1.2 MB)</text>
        </g>
      </g>
    </g>

    <!-- Policy 2 (Collapsed Accordion) -->
    <g transform="translate(0, 255)">
      <rect width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(32, 30)">
        <rect width="106" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" />
        <text x="53" y="16" class="font-sans" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">WORKING HOURS</text>

        <text x="124" y="18" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">Attendance, Core Hours, and Flexible Scheduling</text>
        <text x="124" y="38" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Core hours are 9:00 AM – 3:00 PM with flexible 8-hour daily completion • Version 1.8</text>
        <text x="960" y="24" class="font-sans" font-size="13" font-weight="700" fill="#64748B" text-anchor="end">▼ Expand</text>
      </g>
    </g>

    <!-- Policy 3 (Collapsed Accordion) -->
    <g transform="translate(0, 380)">
      <rect width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(32, 30)">
        <rect width="106" height="24" rx="12" fill="#EFF6FF" stroke="#BFDBFE" />
        <text x="53" y="16" class="font-sans" font-size="10" font-weight="700" fill="#2563EB" text-anchor="middle">REMOTE WORK</text>

        <text x="124" y="18" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">Hybrid &amp; Remote Work Operations Guideline</text>
        <text x="124" y="38" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Eligible employees may work remotely up to 2 days per week upon supervisor agreement • Version 3.1</text>
        <text x="960" y="24" class="font-sans" font-size="13" font-weight="700" fill="#64748B" text-anchor="end">▼ Expand</text>
      </g>
    </g>

    <!-- Policy 4 (Collapsed Accordion) -->
    <g transform="translate(0, 505)">
      <rect width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(32, 30)">
        <rect width="100" height="24" rx="12" fill="#FFFBEB" stroke="#FDE68A" />
        <text x="50" y="16" class="font-sans" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">LEAVE POLICY</text>

        <text x="120" y="18" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">Annual, Sick, Departure, and Special Leave Entitlements</text>
        <text x="120" y="38" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Comprehensive breakdown of 21 annual paid days, 10 sick days, and notice periods • Version 2.0</text>
        <text x="960" y="24" class="font-sans" font-size="13" font-weight="700" fill="#64748B" text-anchor="end">▼ Expand</text>
      </g>
    </g>

    <!-- Policy 5 (Collapsed Accordion) -->
    <g transform="translate(0, 630)">
      <rect width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(32, 30)">
        <rect width="100" height="24" rx="12" fill="#FEF2F2" stroke="#FECACA" />
        <text x="50" y="16" class="font-sans" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">SECURITY</text>

        <text x="120" y="18" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">Information Security, Passwords &amp; Device Protection</text>
        <text x="120" y="38" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Requirements for multi-factor authentication, secure device locks, and confidential data storage • Version 4.0</text>
        <text x="960" y="24" class="font-sans" font-size="13" font-weight="700" fill="#64748B" text-anchor="end">▼ Expand</text>
      </g>
    </g>
  </g>

  <!-- Right Annotation -->
  <g transform="translate(1280, 480)">
    <path d="M-10 0H20" class="annotation-line" />
    <text x="28" y="4" class="font-sans annotation-text">Interactive Policies</text>
    <text x="28" y="20" class="font-sans" font-size="11" fill="#64748B">Loaded from policies.json</text>
    <text x="28" y="36" class="font-sans" font-size="11" fill="#64748B">Category filters &amp; search</text>
  </g>
</svg>
