<svg width="1440" height="1500" viewBox="0 0 1440 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
      .text-figma-title { font-weight: 700; fill: #1E293B; font-size: 18px; }
      .text-figma-meta { font-weight: 500; fill: #64748B; font-size: 12px; }
      .text-badge-num { font-weight: 700; fill: #FFFFFF; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .annotation-text { font-weight: 600; fill: #334155; font-size: 13px; }
      .annotation-line { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .measure-text { font-weight: 600; fill: #64748B; font-size: 11px; text-anchor: end; }
      .measure-line { stroke: #CBD5E1; stroke-width: 1; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.06)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.30)); }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="1500" fill="#F8FAFC" />

  <!-- Figma Header Bar -->
  <g id="Figma-Header" transform="translate(60, 24)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="8" height="8" rx="4" fill="#F24E1E" />
      <rect x="8" y="0" width="8" height="8" rx="4" fill="#FF7262" />
      <rect x="0" y="8" width="8" height="8" rx="4" fill="#A259FF" />
      <circle cx="12" cy="12" r="4" fill="#1ABCFE" />
      <rect x="0" y="16" width="8" height="8" rx="4" fill="#0ACF83" />
    </g>
    <text x="28" y="15" class="font-sans text-figma-title">Figma Wireframe • HR Leave Review &amp; Approval Center</text>

    <g transform="translate(800, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta" text-anchor="middle">Approval / Rejection Engine</text>
      <path d="M0 16V28M-4 24L0 28L4 24" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(1080, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta">LocalStorage Real-time Sync</text>
      <path d="M-10 7H-40" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- 12-Column Grid -->
  <g id="Figma-Grid-Columns" opacity="0.20">
    <rect x="180" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="270" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="360" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="450" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="540" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="630" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="720" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="810" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="900" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="990" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="1080" y="70" width="70" height="1400" fill="#EFF6FF" />
    <rect x="1170" y="70" width="70" height="1400" fill="#EFF6FF" />
  </g>

  <!-- Top Navigation Bar -->
  <g id="Navbar" transform="translate(180, 64)">
    <rect width="1080" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    <g transform="translate(24, 16)">
      <rect width="34" height="34" rx="8" fill="#2563EB" />
      <path d="M10 17L15 22L24 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="24" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(300, 25)">
      <text x="0" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">← Back to Home</text>
      <text x="140" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Employee Directory</text>
      <text x="290" y="14" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">Leave Approvals (4)</text>
      <text x="440" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Task Review (2)</text>
    </g>
    <g transform="translate(930, 14)">
      <circle cx="18" cy="18" r="16" fill="#0F172A" />
      <text x="18" y="22" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HR</text>
      <text x="42" y="23" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Alex Vance</text>
    </g>
  </g>

  <!-- Page Header -->
  <g transform="translate(180, 160)">
    <rect width="170" height="26" rx="13" fill="#ECFDF5" />
    <text x="85" y="17" class="font-sans" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">LEAVE DESK OVERVIEW</text>
    <text x="0" y="60" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">Leave Applications &amp; Review Center</text>
    <text x="0" y="84" class="font-sans" font-size="14" font-weight="400" fill="#64748B">Review, approve, or reject employee absence requests. Decisions immediately update employee portals.</text>
  </g>

  <!-- 3 Executive KPI Cards with Clean Vector Icons -->
  <g transform="translate(180, 270)">
    <!-- KPI 1 -->
    <rect width="340" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    <rect x="24" y="20" width="36" height="36" rx="10" fill="#FFFBEB" />
    <circle cx="42" cy="38" r="5" fill="#D97706" />
    <text x="72" y="32" class="font-sans" font-size="11" font-weight="700" fill="#64748B">PENDING APPROVALS</text>
    <text x="72" y="52" class="font-sans" font-size="22" font-weight="800" fill="#D97706">4 Requests</text>
    <text x="24" y="82" class="font-sans" font-size="11" font-weight="600" fill="#D97706">Immediate attention needed</text>

    <!-- KPI 2 -->
    <g transform="translate(370, 0)">
      <rect width="340" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <rect x="24" y="20" width="36" height="36" rx="10" fill="#ECFDF5" />
      <g transform="translate(33, 29)">
        <path d="M4 10L8 14L16 6" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="72" y="32" class="font-sans" font-size="11" font-weight="700" fill="#64748B">APPROVED THIS MONTH</text>
      <text x="72" y="52" class="font-sans" font-size="22" font-weight="800" fill="#059669">18 Applications</text>
      <text x="24" y="82" class="font-sans" font-size="11" font-weight="500" fill="#059669">92% acceptance rate</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(740, 0)">
      <rect width="340" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <rect x="24" y="20" width="36" height="36" rx="10" fill="#FEF2F2" />
      <g transform="translate(33, 29)">
        <path d="M5 5L15 15M15 5L5 15" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <text x="72" y="32" class="font-sans" font-size="11" font-weight="700" fill="#64748B">REJECTED REQUESTS</text>
      <text x="72" y="52" class="font-sans" font-size="22" font-weight="800" fill="#0F172A">2 Requests</text>
      <text x="24" y="82" class="font-sans" font-size="11" font-weight="500" fill="#64748B">Notice period &amp; sprint clash</text>
    </g>
  </g>

  <!-- Filter & Search Toolbar -->
  <g transform="translate(180, 400)">
    <rect width="1080" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    
    <g transform="translate(20, 12)">
      <rect width="340" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="24" cy="20" r="5" stroke="#64748B" stroke-width="1.6" fill="none"/>
      <line x1="28" y1="24" x2="33" y2="29" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
      <text x="42" y="26" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Filter by employee name...</text>
    </g>

    <g transform="translate(380, 12)">
      <rect width="220" height="42" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <text x="16" y="26" class="font-sans" font-size="12" font-weight="700" fill="#2563EB">Status: Pending Review (4)</text>
      <path d="M194 24L198 28L202 24" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </g>

    <g transform="translate(620, 12)">
      <rect width="200" height="42" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
      <text x="16" y="26" class="font-sans" font-size="12" font-weight="600" fill="#0F172A">Leave Type: All</text>
      <path d="M174 24L178 28L182 24" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </g>

    <g transform="translate(840, 12)">
      <rect width="110" height="42" rx="10" fill="#F1F5F9" />
      <text x="55" y="26" class="font-sans" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Reset Filter</text>
    </g>
  </g>

  <!-- Applications Review Table -->
  <g id="HR-Leave-Table" transform="translate(180, 490)">
    <rect width="1080" height="620" rx="20" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    
    <g transform="translate(24, 24)">
      <!-- Table Header -->
      <rect width="1032" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="24" y="26" class="font-sans" font-size="11" font-weight="700" fill="#64748B">REF / APPLICANT</text>
      <text x="260" y="26" class="font-sans" font-size="11" font-weight="700" fill="#64748B">DEPARTMENT</text>
      <text x="400" y="26" class="font-sans" font-size="11" font-weight="700" fill="#64748B">DATES &amp; DURATION</text>
      <text x="590" y="26" class="font-sans" font-size="11" font-weight="700" fill="#64748B">REASON PROVIDED</text>
      <text x="800" y="26" class="font-sans" font-size="11" font-weight="700" fill="#64748B">STATUS</text>
      <text x="910" y="26" class="font-sans" font-size="11" font-weight="700" fill="#64748B">HR DECISION</text>

      <!-- Row 1: Sarah Jenkins (Pending) -->
      <g transform="translate(0, 50)">
        <rect width="1032" height="74" rx="10" fill="#FFFDF5" stroke="#FDE68A" stroke-width="1.5" />
        
        <circle cx="34" cy="37" r="16" fill="#2563EB" />
        <text x="34" y="41" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">SJ</text>
        <text x="60" y="32" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Sarah Jenkins</text>
        <text x="60" y="48" class="font-sans" font-size="11" font-weight="500" fill="#64748B">#LV-814 • Early Departure</text>

        <text x="260" y="42" class="font-sans" font-size="12" font-weight="600" fill="#475569">Technology</text>
        
        <text x="400" y="33" class="font-sans" font-size="12" font-weight="600" fill="#0F172A">Nov 02 (2 Hours)</text>
        <text x="400" y="49" class="font-sans" font-size="11" font-weight="500" fill="#64748B">3:00 PM – 5:00 PM</text>

        <text x="590" y="33" class="font-sans" font-size="12" font-weight="500" fill="#0F172A">Doctor appointment scheduled.</text>
        <text x="590" y="49" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Morning tasks completed.</text>

        <rect x="800" y="24" width="86" height="24" rx="12" fill="#FFFBEB" stroke="#FDE68A" />
        <text x="843" y="40" class="font-sans" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">Pending •</text>

        <!-- HR Action Buttons: Approve (Green) & Reject (Red) -->
        <g transform="translate(900, 20)">
          <rect width="64" height="32" rx="8" fill="#059669" />
          <text x="32" y="20" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Approve</text>

          <rect x="70" width="54" height="32" rx="8" fill="#FEE2E2" />
          <text x="97" y="20" class="font-sans" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">Reject</text>
        </g>
      </g>

      <!-- Row 2: Michael Scott (Pending) -->
      <g transform="translate(0, 134)">
        <rect width="1032" height="74" rx="10" fill="#FFFDF5" stroke="#FDE68A" stroke-width="1.5" />
        
        <circle cx="34" cy="37" r="16" fill="#0D9488" />
        <text x="34" y="41" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">MS</text>
        <text x="60" y="32" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Michael Scott</text>
        <text x="60" y="48" class="font-sans" font-size="11" font-weight="500" fill="#64748B">#LV-815 • Annual Leave</text>

        <text x="260" y="42" class="font-sans" font-size="12" font-weight="600" fill="#475569">Sales</text>
        
        <text x="400" y="33" class="font-sans" font-size="12" font-weight="600" fill="#0F172A">Oct 18 – Oct 22 (5d)</text>
        <text x="400" y="49" class="font-sans" font-size="11" font-weight="500" fill="#64748B">Balance: 11d remaining</text>

        <text x="590" y="33" class="font-sans" font-size="12" font-weight="500" fill="#0F172A">Annual family break.</text>
        <text x="590" y="49" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Coverage: Dwight S.</text>

        <rect x="800" y="24" width="86" height="24" rx="12" fill="#FFFBEB" stroke="#FDE68A" />
        <text x="843" y="40" class="font-sans" font-size="10" font-weight="700" fill="#D97706" text-anchor="middle">Pending •</text>

        <g transform="translate(900, 20)">
          <rect width="64" height="32" rx="8" fill="#059669" />
          <text x="32" y="20" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Approve</text>

          <rect x="70" width="54" height="32" rx="8" fill="#FEE2E2" />
          <text x="97" y="20" class="font-sans" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">Reject</text>
        </g>
      </g>

      <!-- Row 3: David Miller (Approved) -->
      <g transform="translate(0, 218)">
        <rect width="1032" height="74" fill="#FFFFFF" />
        <line x1="0" y1="74" x2="1032" y2="74" stroke="#F1F5F9" />

        <circle cx="34" cy="37" r="16" fill="#7C3AED" />
        <text x="34" y="41" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">DM</text>
        <text x="60" y="32" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">David Miller</text>
        <text x="60" y="48" class="font-sans" font-size="11" font-weight="500" fill="#64748B">#LV-809 • Sick Leave</text>

        <text x="260" y="42" class="font-sans" font-size="12" font-weight="600" fill="#475569">Design &amp; UX</text>
        
        <text x="400" y="33" class="font-sans" font-size="12" font-weight="600" fill="#0F172A">Sep 27 – Sep 28 (2d)</text>
        <text x="400" y="49" class="font-sans" font-size="11" font-weight="500" fill="#64748B">Medical notice attached</text>

        <text x="590" y="33" class="font-sans" font-size="12" font-weight="500" fill="#0F172A">Seasonal flu and fever.</text>
        <text x="590" y="49" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Reported early morning.</text>

        <rect x="800" y="24" width="86" height="24" rx="12" fill="#ECFDF5" stroke="#A7F3D0" />
        <text x="843" y="40" class="font-sans" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">✓ Approved</text>

        <text x="910" y="42" class="font-sans" font-size="11" font-weight="600" fill="#059669">Approved by Alex V.</text>
      </g>
    </g>
  </g>

  <!-- Right Annotation -->
  <g transform="translate(1280, 540)">
    <path d="M-10 0H20" class="annotation-line" />
    <text x="28" y="4" class="font-sans annotation-text">One-Click Decision Desk</text>
    <text x="28" y="20" class="font-sans" font-size="11" fill="#64748B">Instant Approve or Reject</text>
    <text x="28" y="36" class="font-sans" font-size="11" fill="#64748B">Saves to LocalStorage</text>
  </g>
</svg>
