<svg width="1440" height="1550" viewBox="0 0 1440 1550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
      .text-figma-title { font-weight: 700; fill: #1E293B; font-size: 18px; }
      .text-figma-meta { font-weight: 500; fill: #64748B; font-size: 12px; }
      .text-badge-num { font-weight: 700; fill: #FFFFFF; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .annotation-text { font-weight: 600; fill: #334155; font-size: 13px; }
      .annotation-line { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .measure-text { font-weight: 600; fill: #64748B; font-size: 11px; text-anchor: end; }
      .measure-line { stroke: #CBD5E1; stroke-width: 1; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.06)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
      .modal-shadow { filter: drop-shadow(0 25px 50px rgba(15, 23, 42, 0.20)); }
      .btn-shadow { filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.30)); }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="1550" fill="#F8FAFC" />

  <!-- Figma Header Bar -->
  <g id="Figma-Header" transform="translate(60, 24)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="8" height="8" rx="4" fill="#F24E1E" />
      <rect x="8" y="0" width="8" height="8" rx="4" fill="#FF7262" />
      <rect x="0" y="8" width="8" height="8" rx="4" fill="#A259FF" />
      <circle cx="12" cy="12" r="4" fill="#1ABCFE" />
      <rect x="0" y="16" width="8" height="8" rx="4" fill="#0ACF83" />
    </g>
    <text x="28" y="15" class="font-sans text-figma-title">Figma Wireframe • HR Task Delegation &amp; Solution Review Desk</text>

    <g transform="translate(800, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta" text-anchor="middle">Task Assignment &amp; Tracking</text>
      <path d="M0 16V28M-4 24L0 28L4 24" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(1080, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta">Solution Review Workflow</text>
      <path d="M-10 7H-40" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- 12-Column Grid -->
  <g id="Figma-Grid-Columns" opacity="0.20">
    <rect x="180" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="270" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="360" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="450" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="540" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="630" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="720" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="810" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="900" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="990" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="1080" y="70" width="70" height="1450" fill="#EFF6FF" />
    <rect x="1170" y="70" width="70" height="1450" fill="#EFF6FF" />
  </g>

  <!-- Top Navigation Bar -->
  <g id="Navbar" transform="translate(180, 64)">
    <rect width="1080" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    <g transform="translate(24, 16)">
      <rect width="34" height="34" rx="8" fill="#2563EB" />
      <path d="M10 17L15 22L24 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="24" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(300, 25)">
      <text x="0" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">← Back to Home</text>
      <text x="140" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Employee Directory</text>
      <text x="290" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Leave Approvals</text>
      <text x="440" y="14" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">Task Review (2)</text>
    </g>
    <g transform="translate(930, 14)">
      <circle cx="18" cy="18" r="16" fill="#0F172A" />
      <text x="18" y="22" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">HR</text>
      <text x="42" y="23" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Alex Vance</text>
    </g>
  </g>

  <!-- Page Header & Action -->
  <g transform="translate(180, 160)">
    <rect width="180" height="26" rx="13" fill="#FFFBEB" />
    <text x="90" y="17" class="font-sans" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">TASK MANAGEMENT DESK</text>
    <text x="0" y="60" class="font-sans" font-size="28" font-weight="800" fill="#0F172A">Task Assignment &amp; Solution Review</text>
    <text x="0" y="84" class="font-sans" font-size="14" font-weight="400" fill="#64748B">Assign tasks with priority and due dates, track progress, and review submitted deliverables.</text>

    <!-- Top Action: Create Task Button -->
    <g transform="translate(890, 20)">
      <rect width="190" height="46" rx="12" fill="#2563EB" class="btn-shadow"/>
      <text x="95" y="28" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">+ Create New Task</text>
    </g>
  </g>

  <!-- 4 Kanban Status Columns -->
  <g id="Kanban-Columns" transform="translate(180, 270)">
    
    <!-- Col 1: Pending (2) -->
    <g transform="translate(0, 0)">
      <rect width="255" height="40" rx="10" fill="#F1F5F9" />
      <circle cx="20" cy="20" r="4" fill="#94A3B8" />
      <text x="32" y="25" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">PENDING (2)</text>

      <!-- Task Card in Col 1 -->
      <g transform="translate(0, 52)">
        <rect width="255" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
        <rect x="14" y="14" width="70" height="20" rx="10" fill="#EFF6FF" />
        <text x="49" y="28" class="font-sans" font-size="9" font-weight="700" fill="#2563EB" text-anchor="middle">Low Priority</text>
        <text x="14" y="56" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Update Team Bio Photos</text>
        <text x="14" y="74" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Upload verified headshots for staff.</text>
        <text x="14" y="104" class="font-sans" font-size="11" font-weight="600" fill="#2563EB">• David Miller</text>
        <text x="14" y="128" class="font-sans" font-size="10" fill="#94A3B8">Due: Oct 08, 2026</text>
      </g>
    </g>

    <!-- Col 2: In Progress (3) -->
    <g transform="translate(275, 0)">
      <rect width="255" height="40" rx="10" fill="#EFF6FF" />
      <circle cx="20" cy="20" r="4" fill="#2563EB" />
      <text x="32" y="25" class="font-sans" font-size="12" font-weight="700" fill="#1D4ED8">IN PROGRESS (3)</text>

      <!-- Task Card in Col 2 -->
      <g transform="translate(0, 52)">
        <rect width="255" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
        <rect x="14" y="14" width="80" height="20" rx="10" fill="#FEF2F2" />
        <text x="54" y="28" class="font-sans" font-size="9" font-weight="700" fill="#DC2626" text-anchor="middle">High Priority</text>
        <text x="14" y="56" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Responsive Nav Layout</text>
        <text x="14" y="74" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Bootstrap navbar + auth listener.</text>
        <text x="14" y="104" class="font-sans" font-size="11" font-weight="600" fill="#2563EB">• Sarah Jenkins</text>
        <text x="14" y="128" class="font-sans" font-size="10" font-weight="600" fill="#D97706">Due: Tomorrow</text>
      </g>
    </g>

    <!-- Col 3: Submitted / Needs Review (2) -->
    <g transform="translate(550, 0)">
      <rect width="255" height="40" rx="10" fill="#FFFBEB" stroke="#FDE68A" />
      <circle cx="20" cy="20" r="4" fill="#D97706" />
      <text x="32" y="25" class="font-sans" font-size="12" font-weight="700" fill="#D97706">SUBMITTED (2)</text>

      <!-- Task Card 1 (Active Solution Waiting) -->
      <g transform="translate(0, 52)">
        <rect width="255" height="150" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" class="card-shadow" />
        <rect x="14" y="14" width="84" height="20" rx="10" fill="#FFFBEB" />
        <text x="56" y="28" class="font-sans" font-size="9" font-weight="700" fill="#D97706" text-anchor="middle">Needs Review</text>
        <text x="14" y="56" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Footer Map &amp; Feedback</text>
        <text x="14" y="74" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Submitted solution waiting review.</text>
        <text x="14" y="104" class="font-sans" font-size="11" font-weight="600" fill="#2563EB">• Sarah Jenkins</text>
        
        <rect x="136" y="112" width="105" height="26" rx="6" fill="#D97706" />
        <text x="188" y="129" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Review Solution →</text>
      </g>
    </g>

    <!-- Col 4: Completed (6) -->
    <g transform="translate(825, 0)">
      <rect width="255" height="40" rx="10" fill="#ECFDF5" />
      <circle cx="20" cy="20" r="4" fill="#059669" />
      <text x="32" y="25" class="font-sans" font-size="12" font-weight="700" fill="#059669">COMPLETED (6)</text>

      <!-- Completed Task Card -->
      <g transform="translate(0, 52)">
        <rect width="255" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
        <rect x="14" y="14" width="80" height="20" rx="10" fill="#ECFDF5" />
        <text x="54" y="28" class="font-sans" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">✓ Approved</text>
        <text x="14" y="56" class="font-sans" font-size="13" font-weight="700" fill="#0F172A">Employee JSON Data Seed</text>
        <text x="14" y="74" class="font-sans" font-size="11" font-weight="400" fill="#64748B">Staff profiles loaded properly.</text>
        <text x="14" y="104" class="font-sans" font-size="11" font-weight="600" fill="#2563EB">• Michael Scott</text>
        <text x="14" y="128" class="font-sans" font-size="10" fill="#059669">Approved by Alex V.</text>
      </g>
    </g>
  </g>

  <!-- ==================== HR SOLUTION REVIEW MODAL (DRAWER SIMULATION) ==================== -->
  <g id="HR-Solution-Review-Modal" transform="translate(320, 560)">
    <rect width="800" height="660" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" class="modal-shadow" />

    <!-- Header -->
    <path d="M0 24C0 10.7452 10.7452 0 24 0H776C789.255 0 800 10.7452 800 24V64H0V24Z" fill="#EFF6FF" />
    <path d="M0 64H800" stroke="#DBEAFE" stroke-width="1" />
    <text x="32" y="40" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">HR Task Solution Review • #TSK-395 (Sarah Jenkins)</text>
    <text x="768" y="38" class="font-sans" font-size="18" font-weight="700" fill="#64748B" text-anchor="end">×</text>

    <!-- Modal Content -->
    <g transform="translate(32, 90)">
      
      <!-- Task Meta Bar -->
      <g>
        <text x="0" y="16" class="font-sans" font-size="12" font-weight="700" fill="#64748B">TASK ASSIGNED:</text>
        <text x="0" y="38" class="font-sans" font-size="16" font-weight="800" fill="#0F172A">Design Footer Map &amp; Direct Feedback Integration</text>
        <text x="0" y="58" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Deliverable: Embed responsive Google Map &amp; link contact feedback to LocalStorage.</text>
      </g>

      <!-- Employee Submitted Solution Container -->
      <g transform="translate(0, 80)">
        <rect width="736" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
        <g transform="translate(16, 16)">
          <text x="0" y="16" class="font-sans" font-size="12" font-weight="700" fill="#2563EB">EMPLOYEE SUBMITTED SOLUTION NOTES:</text>
          <text x="0" y="40" class="font-sans" font-size="13" font-weight="500" fill="#0F172A">"Completed the footer section with Bootstrap grid columns. Added Google Map SVG container,</text>
          <text x="0" y="58" class="font-sans" font-size="13" font-weight="500" fill="#0F172A">connected the feedback inputs to JSON.stringify in LocalStorage, and verified instant reflection</text>
          <text x="0" y="76" class="font-sans" font-size="13" font-weight="500" fill="#0F172A">in the HR feedback manager tab. Tested responsive viewports down to 375px."</text>
          
          <rect y="92" width="220" height="28" rx="6" fill="#EFF6FF" stroke="#BFDBFE" />
          <g transform="translate(10, 98)">
            <path d="M7 11L10 11C11.6 11 13 9.6 13 8C13 6.4 11.6 5 10 5L7 5M9 8L5 8M7 8L4 8C2.4 8 1 9.4 1 11C1 12.6 2.4 14 4 14L7 14" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <text x="22" y="12" class="font-sans" font-size="11" font-weight="600" fill="#2563EB">View Pull Request / Demo</text>
          </g>
        </g>
      </g>

      <!-- HR Review & Feedback Form -->
      <g transform="translate(0, 255)">
        <text x="0" y="16" class="font-sans" font-size="12" font-weight="700" fill="#0F172A">HR REVIEW DECISION &amp; FEEDBACK NOTES</text>
        <text x="0" y="34" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Your review decision and notes will be delivered directly to the employee's task board.</text>

        <!-- HR Notes Input Field -->
        <rect y="46" width="736" height="74" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
        <text x="14" y="70" class="font-sans" font-size="12" font-weight="500" fill="#0F172A">Excellent execution! Clean code and local storage synchronization works flawlessly.</text>
        <text x="14" y="88" class="font-sans" font-size="12" font-weight="500" fill="#0F172A">Task approved for release.</text>

        <!-- Decision Buttons -->
        <g transform="translate(0, 140)">
          <!-- Option 1: Approve Solution (Completed) -->
          <rect width="260" height="46" rx="12" fill="#059669" class="btn-shadow"/>
          <text x="130" y="28" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Approve Solution (Mark Completed)</text>

          <!-- Option 2: Request Changes -->
          <rect x="276" width="230" height="46" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
          <text x="391" y="28" class="font-sans" font-size="13" font-weight="700" fill="#D97706" text-anchor="middle">↺ Request Revisions / Changes</text>

          <!-- Cancel -->
          <rect x="522" width="100" height="46" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
          <text x="572" y="28" class="font-sans" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Annotation -->
  <g transform="translate(1280, 520)">
    <path d="M-10 0H20" class="annotation-line" />
    <text x="28" y="4" class="font-sans annotation-text">Task Review Desk</text>
    <text x="28" y="20" class="font-sans" font-size="11" fill="#64748B">Inspect submitted solution</text>
    <text x="28" y="36" class="font-sans" font-size="11" fill="#64748B">Approve or request changes</text>
  </g>
</svg>
