<svg width="1440" height="1900" viewBox="0 0 1440 1900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; }
      .text-figma-title { font-weight: 700; fill: #1E293B; font-size: 18px; }
      .text-figma-meta { font-weight: 500; fill: #64748B; font-size: 12px; }
      .text-badge-num { font-weight: 700; fill: #FFFFFF; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
      .annotation-text { font-weight: 600; fill: #334155; font-size: 13px; }
      .annotation-line { stroke: #94A3B8; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .measure-text { font-weight: 600; fill: #64748B; font-size: 11px; text-anchor: end; }
      .measure-line { stroke: #CBD5E1; stroke-width: 1; }
      .card-shadow { filter: drop-shadow(0 10px 25px rgba(15, 23, 42, 0.06)) drop-shadow(0 1px 3px rgba(15, 23, 42, 0.04)); }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1440" height="1900" fill="#F8FAFC" />

  <!-- Figma Header Bar -->
  <g id="Figma-Header" transform="translate(60, 24)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="8" height="8" rx="4" fill="#F24E1E" />
      <rect x="8" y="0" width="8" height="8" rx="4" fill="#FF7262" />
      <rect x="0" y="8" width="8" height="8" rx="4" fill="#A259FF" />
      <circle cx="12" cy="12" r="4" fill="#1ABCFE" />
      <rect x="0" y="16" width="8" height="8" rx="4" fill="#0ACF83" />
    </g>
    <text x="28" y="15" class="font-sans text-figma-title">Figma Wireframe • About Us &amp; Team Showcase</text>

    <g transform="translate(780, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta" text-anchor="middle">Company Story &amp; Values</text>
      <path d="M0 16V28M-4 24L0 28L4 24" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
    <g transform="translate(1080, 2)">
      <text x="0" y="10" class="font-sans text-figma-meta">Team Member Cards Grid</text>
      <path d="M-10 7H-40" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- 12-Column Grid -->
  <g id="Figma-Grid-Columns" opacity="0.20">
    <rect x="180" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="270" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="360" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="450" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="540" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="630" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="720" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="810" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="900" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="990" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="1080" y="70" width="70" height="1800" fill="#EFF6FF" />
    <rect x="1170" y="70" width="70" height="1800" fill="#EFF6FF" />
  </g>

  <!-- Top Navigation Bar -->
  <g id="Navbar" transform="translate(180, 64)">
    <rect width="1080" height="66" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" class="card-shadow" />
    <g transform="translate(24, 16)">
      <rect width="34" height="34" rx="8" fill="#2563EB" />
      <path d="M10 17L15 22L24 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="24" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Bridgeway<tspan fill="#2563EB">HR</tspan></text>
    </g>
    <g transform="translate(320, 25)">
      <text x="0" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">← Back to Home</text>
      <text x="140" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Services</text>
      <text x="240" y="14" class="font-sans" font-size="14" font-weight="700" fill="#2563EB">About Us</text>
      <text x="340" y="14" class="font-sans" font-size="14" font-weight="500" fill="#475569">Contact &amp; Map</text>
    </g>
    <g transform="translate(950, 14)">
      <rect width="106" height="38" rx="10" fill="#2563EB" />
      <text x="53" y="24" class="font-sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Portal Login →</text>
    </g>
  </g>

  <!-- Page Hero: Mission & Vision -->
  <g transform="translate(180, 160)">
    <rect width="130" height="26" rx="13" fill="#EFF6FF" />
    <text x="65" y="17" class="font-sans" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">ABOUT BRIDGEWAY</text>
    <text x="0" y="60" class="font-sans" font-size="34" font-weight="800" fill="#0F172A">Empowering People &amp; Transforming HR Workflows</text>
    <text x="0" y="88" class="font-sans" font-size="15" font-weight="400" fill="#64748B">Bridgeway HR Management System was engineered to simplify team collaboration, streamline leave processing,</text>
    <text x="0" y="108" class="font-sans" font-size="15" font-weight="400" fill="#64748B">and deliver transparency through modern, accessible front-end web technologies.</text>
  </g>

  <!-- 3 Core Values Cards with Multi-Line Wrapped Text & Vector Icons -->
  <g transform="translate(180, 310)">
    <!-- Value 1 -->
    <rect width="340" height="210" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#EFF6FF" />
    <g transform="translate(36, 36)">
      <path d="M12 2L4 12H11L8 20L18 9H11L14 2H12Z" fill="#2563EB"/>
    </g>
    <text x="24" y="98" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">Agility &amp; Speed</text>
    <text x="24" y="122" class="font-sans" font-size="12" font-weight="400" fill="#64748B">
      <tspan x="24" dy="0">Instant client-side responsiveness</tspan>
      <tspan x="24" dy="18">powered by semantic Bootstrap 5 and</tspan>
      <tspan x="24" dy="18">modern Vanilla JavaScript.</tspan>
    </text>
    <text x="24" y="186" class="font-sans" font-size="11" font-weight="700" fill="#2563EB">Instant LocalStorage state →</text>

    <!-- Value 2 -->
    <g transform="translate(370, 0)">
      <rect width="340" height="210" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#ECFDF5" />
      <g transform="translate(36, 36)">
        <path d="M4 10L8 14L16 6" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="24" y="98" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">Transparency &amp; Trust</text>
      <text x="24" y="122" class="font-sans" font-size="12" font-weight="400" fill="#64748B">
        <tspan x="24" dy="0">Zero ambiguity in leave tracking and</tspan>
        <tspan x="24" dy="18">task reviews. Employees see live</tspan>
        <tspan x="24" dy="18">decision updates in real time.</tspan>
      </text>
      <text x="24" y="186" class="font-sans" font-size="11" font-weight="700" fill="#059669">Live decision sync →</text>
    </g>

    <!-- Value 3 -->
    <g transform="translate(740, 0)">
      <rect width="340" height="210" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <rect x="24" y="24" width="44" height="44" rx="12" fill="#EEF2FF" />
      <g transform="translate(36, 36)">
        <path d="M10 18L8.5 16.7C3.5 12.2 0 9 0 5C0 2.2 2.2 0 5 0C6.6 0 8.1 0.7 9 1.9C9.9 0.7 11.4 0 13 0C15.8 0 18 2.2 18 5C18 9 14.5 12.2 9.5 16.7L10 18Z" fill="#4F46E5"/>
      </g>
      <text x="24" y="98" class="font-sans" font-size="17" font-weight="800" fill="#0F172A">People-First Culture</text>
      <text x="24" y="122" class="font-sans" font-size="12" font-weight="400" fill="#64748B">
        <tspan x="24" dy="0">Designed for human experiences: easy</tspan>
        <tspan x="24" dy="18">communication, anonymous feedback,</tspan>
        <tspan x="24" dy="18">and virtual meetings.</tspan>
      </text>
      <text x="24" y="186" class="font-sans" font-size="11" font-weight="700" fill="#4F46E5">Supportive workplace →</text>
    </g>
  </g>

  <!-- ==================== TEAM SHOWCASE SECTION ==================== -->
  <g transform="translate(180, 560)">
    <text x="540" y="30" class="font-sans" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle">Meet Our Executive Team</text>
    <text x="540" y="56" class="font-sans" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">The dedicated team behind the engineering, operations, and design of Bridgeway HR.</text>

    <!-- 4 Team Cards Grid (2x2) -->
    <!-- Member 1: Alex Vance -->
    <g transform="translate(0, 90)">
      <rect width="520" height="200" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(24, 24)">
        <circle cx="40" cy="40" r="40" fill="#0F172A" />
        <text x="40" y="47" class="font-sans" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">AV</text>
        
        <g transform="translate(100, 10)">
          <text x="0" y="20" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Alex Vance</text>
          <text x="0" y="40" class="font-sans" font-size="12" font-weight="700" fill="#2563EB">DIRECTOR OF HR &amp; PEOPLE OPERATIONS</text>
          <text x="0" y="64" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Specializes in talent strategy, organizational development,</text>
          <text x="0" y="80" class="font-sans" font-size="12" font-weight="400" fill="#64748B">and workplace culture transformation.</text>

          <g transform="translate(0, 98)">
            <rect width="14" height="10" rx="1.5" stroke="#64748B" stroke-width="1.2" fill="none"/>
            <path d="M0 1L7 6L14 1" stroke="#64748B" stroke-width="1"/>
            <text x="20" y="10" class="font-sans" font-size="11" font-weight="600" fill="#64748B">alex.vance@bridgeway.corp</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Member 2: Sarah Jenkins -->
    <g transform="translate(560, 90)">
      <rect width="520" height="200" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(24, 24)">
        <circle cx="40" cy="40" r="40" fill="#2563EB" />
        <text x="40" y="47" class="font-sans" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">SJ</text>
        
        <g transform="translate(100, 10)">
          <text x="0" y="20" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Sarah Jenkins</text>
          <text x="0" y="40" class="font-sans" font-size="12" font-weight="700" fill="#2563EB">SENIOR FRONTEND ENGINEER</text>
          <text x="0" y="64" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Leads UI design system engineering, responsive architecture,</text>
          <text x="0" y="80" class="font-sans" font-size="12" font-weight="400" fill="#64748B">and local storage state synchronization.</text>

          <g transform="translate(0, 98)">
            <rect width="14" height="10" rx="1.5" stroke="#64748B" stroke-width="1.2" fill="none"/>
            <path d="M0 1L7 6L14 1" stroke="#64748B" stroke-width="1"/>
            <text x="20" y="10" class="font-sans" font-size="11" font-weight="600" fill="#64748B">sarah.jenkins@bridgeway.corp</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Member 3: Michael Scott -->
    <g transform="translate(0, 310)">
      <rect width="520" height="200" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(24, 24)">
        <circle cx="40" cy="40" r="40" fill="#0D9488" />
        <text x="40" y="47" class="font-sans" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">MS</text>
        
        <g transform="translate(100, 10)">
          <text x="0" y="20" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">Michael Scott</text>
          <text x="0" y="40" class="font-sans" font-size="12" font-weight="700" fill="#059669">REGIONAL OPERATIONS LEAD</text>
          <text x="0" y="64" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Coordinates cross-branch operational syncs, task delegation,</text>
          <text x="0" y="80" class="font-sans" font-size="12" font-weight="400" fill="#64748B">and external client relations.</text>

          <g transform="translate(0, 98)">
            <rect width="14" height="10" rx="1.5" stroke="#64748B" stroke-width="1.2" fill="none"/>
            <path d="M0 1L7 6L14 1" stroke="#64748B" stroke-width="1"/>
            <text x="20" y="10" class="font-sans" font-size="11" font-weight="600" fill="#64748B">michael.scott@bridgeway.corp</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Member 4: David Miller -->
    <g transform="translate(560, 310)">
      <rect width="520" height="200" rx="18" fill="#FFFFFF" stroke="#E2E8F0" class="card-shadow" />
      <g transform="translate(24, 24)">
        <circle cx="40" cy="40" r="40" fill="#7C3AED" />
        <text x="40" y="47" class="font-sans" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">DM</text>
        
        <g transform="translate(100, 10)">
          <text x="0" y="20" class="font-sans" font-size="18" font-weight="800" fill="#0F172A">David Miller</text>
          <text x="0" y="40" class="font-sans" font-size="12" font-weight="700" fill="#7C3AED">HEAD OF PRODUCT DESIGN &amp; UX</text>
          <text x="0" y="64" class="font-sans" font-size="12" font-weight="400" fill="#64748B">Crafting accessible, pixel-perfect user journeys and modern</text>
          <text x="0" y="80" class="font-sans" font-size="12" font-weight="400" fill="#64748B">SaaS micro-interactions.</text>

          <g transform="translate(0, 98)">
            <rect width="14" height="10" rx="1.5" stroke="#64748B" stroke-width="1.2" fill="none"/>
            <path d="M0 1L7 6L14 1" stroke="#64748B" stroke-width="1"/>
            <text x="20" y="10" class="font-sans" font-size="11" font-weight="600" fill="#64748B">david.miller@bridgeway.corp</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== SECTION: COMPREHENSIVE FOOTER ==================== -->
  <g id="Footer-Section" transform="translate(0, 1390)">
    <rect width="1440" height="510" fill="#0F172A" />

    <g transform="translate(180, 50)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <rect width="32" height="32" rx="8" fill="#2563EB" />
        <path d="M8 16L13 21L22 11" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="23" class="font-sans" font-size="18" font-weight="800" fill="#FFFFFF">Bridgeway<tspan fill="#60A5FA">HR</tspan></text>
        <text x="0" y="65" class="font-sans" font-size="13" font-weight="400" fill="#94A3B8">Comprehensive Human Resource Management Platform.</text>
        
        <g transform="translate(0, 95)">
          <text x="0" y="16" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF">HQ ADDRESS</text>
          <text x="0" y="34" class="font-sans" font-size="12" font-weight="400" fill="#94A3B8">King Hussein Business Park, Bldg 23, Amman, Jordan</text>
          <text x="0" y="66" class="font-sans" font-size="12" font-weight="700" fill="#FFFFFF">DIRECT CONTACT</text>
          <text x="0" y="84" class="font-sans" font-size="12" font-weight="400" fill="#94A3B8">Phone: +962 6 500 0000 • Email: hr@bridgeway.corp</text>
        </g>
      </g>

      <!-- Col 2: Feedback Form -->
      <g transform="translate(380, 0)">
        <text x="0" y="20" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">Employee Feedback Form</text>
        <text x="0" y="38" class="font-sans" font-size="11" font-weight="400" fill="#94A3B8">Send inquiries or feedback directly to HR local storage:</text>
        
        <g transform="translate(0, 50)">
          <rect width="320" height="34" rx="8" fill="#1E293B" stroke="#334155" />
          <text x="12" y="22" class="font-sans" font-size="11" fill="#64748B">Your Name / Employee ID</text>
          
          <rect y="44" width="320" height="34" rx="8" fill="#1E293B" stroke="#334155" />
          <text x="12" y="66" class="font-sans" font-size="11" fill="#64748B">Email Address</text>

          <rect y="88" width="320" height="54" rx="8" fill="#1E293B" stroke="#334155" />
          <text x="12" y="110" class="font-sans" font-size="11" fill="#64748B">Write your message or feedback...</text>

          <rect y="152" width="140" height="34" rx="8" fill="#2563EB" />
          <text x="70" y="174" class="font-sans" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Submit Feedback</text>
        </g>
      </g>

      <!-- Col 3: Map -->
      <g transform="translate(750, 0)">
        <text x="0" y="20" class="font-sans" font-size="15" font-weight="700" fill="#FFFFFF">Office Location Map</text>
        <text x="0" y="38" class="font-sans" font-size="11" font-weight="400" fill="#94A3B8">Interactive Google Maps embed container:</text>

        <g transform="translate(0, 50)">
          <rect width="330" height="190" rx="12" fill="#1E293B" stroke="#334155" />
          <path d="M0 60H330M0 120H330M80 0V190M200 0V190M270 0V190" stroke="#334155" stroke-width="1" />
          <path d="M40 190L160 80L240 120L310 30" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
          
          <g transform="translate(160, 70)">
            <circle cx="0" cy="0" r="14" fill="#EF4444" />
            <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
            <path d="M-6 8L0 20L6 8" fill="#EF4444" />
          </g>
          
          <rect x="90" y="100" width="140" height="24" rx="6" fill="#0F172A" stroke="#334155" />
          <text x="160" y="116" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bridgeway Innovation Park</text>
        </g>
      </g>
    </g>

    <!-- Bottom Divider -->
    <path d="M180 430H1260" stroke="#334155" stroke-width="1" />
    <text x="180" y="465" class="font-sans" font-size="12" font-weight="400" fill="#64748B">© 2026 Bridgeway HR Management System • Junior Team Project</text>
    <text x="1260" y="465" class="font-sans" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="end">HTML5 • Bootstrap 5 • Vanilla JS • LocalStorage</text>
  </g>
</svg>
